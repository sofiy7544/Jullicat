name: Deploy to GitHub Pages

# Публикует статический сайт (index.html и ассеты PWA) на GitHub Pages.
# После первого успешного запуска сайт доступен по адресу вида
# https://<пользователь>.github.io/<репозиторий>/

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Права, нужные для публикации на Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Не отменять уже идущую публикацию, очередь по одному запуску
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        # enablement: true — включает Pages в репозитории автоматически,
        # не нужно щёлкать тумблер в Settings вручную
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
